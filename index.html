<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Secure App Relay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0369a1; }
        .result {
            margin-top: 20px;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud App Relay</h2>
    <p>Ilagay ang link ng laro o app. Ang cloud ang magda-download para sa iyo nang ligtas at hiwalay!</p>
    
    <input type="text" id="appUrl" placeholder="I-paste ang APK link dito...">
    <button onclick="generateSecureLink()">I-process sa Cloud</button>

    <div class="result" id="resultBox">
        <p style="margin: 0 0 8px 0; color: #22c55e;">Handa na ang iyong pribadong link!</p>
        <a id="downloadLink" href="#" target="_blank">I-download na rito</a>
    </div>
</div>

<script>
async function generateSecureLink() {
    const url = document.getElementById('appUrl').value;
    if(!url) return alert('Maglagay muna ng valid link!');

    const btn = document.querySelector('button');
    btn.innerText = 'Pinoproseso ng Cloud...';
    btn.disabled = true;

    try {
        const response = await fetch('/api/create-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();
        if(data.success) {
            const resultBox = document.getElementById('resultBox');
            const downloadLink = document.getElementById('downloadLink');
            
            const fullUrl = window.location.origin + data.securePath;
            downloadLink.href = fullUrl;
            downloadLink.innerText = fullUrl;
            resultBox.style.display = 'block';
        } else {
            alert('May error: ' + data.error);
        }
    } catch (err) {
        alert('Hindi makakonekta sa cloud server.');
    } finally {
        btn.innerText = 'I-process sa Cloud';
        btn.disabled = false;
    }
}
</script>

</body>
      </html>
