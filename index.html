<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Secure App Relay - Live Transfer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0369a1; }
        .progress-container {
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #334155;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #22c55e;
            transition: width 0.3s ease;
        }
        .status-text {
            font-size: 12px;
            color: #38bdf8;
            margin-top: 6px;
        }
        .result {
            margin-top: 20px;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud App Relay</h2>
    <p>I-paste ang link ng laro o app. Ang cloud ang magda-download para sa iyo, tapos ay awtomatikong ipapasa nang mabilis!</p>
    
    <input type="text" id="appUrl" placeholder="I-paste ang APK link dito...">
    <button id="actionBtn" onclick="startRealDownload()">Simulan ang Cloud Transfer</button>

    <div class="progress-container" id="progressContainer">
        <div class="status-text" id="statusText">Kinokontak ang Cloud Server...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="result" id="resultBox">
        <p style="margin: 0 0 8px 0; color: #22c55e; font-size: 14px;">Handa na ang App para sa Pasahan!</p>
        <a id="downloadLink" href="#" target="_blank">I-download at Ipasa Na</a>
    </div>
</div>

<script>
async function startRealDownload() {
    const url = document.getElementById('appUrl').value;
    if(!url) return alert('Maglagay muna ng valid link!');

    const btn = document.getElementById('actionBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');

    btn.disabled = true;
    btn.innerText = 'Pinoproseso...';
    progressContainer.style.display = 'block';
    progressFill.style.width = '30%';
    statusText.innerText = 'Ginagaya ang Fake Phone para i-download ang file...';

    try {
        const response = await fetch('/api/create-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        });

        progressFill.style.width = '70%';
        statusText.innerText = 'Inihahanda ang Share-It style local stream...';

        const data = await response.json();
        
        if(data.success) {
            progressFill.style.width = '100%';
            statusText.innerText = 'Tagumpay! Handa nang ipasa.';
            
            const fullUrl = window.location.origin + data.securePath;
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = fullUrl;
            downloadLink.innerText = "I-download ang App (Diretso sa Device)";
            resultBox.style.display = 'block';

            // Opsyonal: Awtomatikong i-trigger ang pag-download pagkalipas ng 1 segundo
            setTimeout(() => {
                window.location.href = fullUrl;
            }, 1000);

        } else {
            alert('Error: ' + data.error);
            progressContainer.style.display = 'none';
        }
    } catch (err) {
        alert('Hindi makakonekta sa cloud server.');
        progressContainer.style.display = 'none';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Simulan ang Cloud Transfer';
    }
}
</script>

</body>
</html>
